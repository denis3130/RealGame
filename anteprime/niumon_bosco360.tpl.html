<title>Bosco di notte 360°</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Una radura nel bosco di notte in 3D (stile HD-2D): tutto quello che c'è sono sprite in pixel art messi nel mondo, la telecamera
   gira a 360 gradi col dito. Sopra: la lotta (targhe, messaggio, mosse) e i comandi della telecamera; seconda scheda: tutti gli
   sprite da vicino. Un solo aspetto scuro di proposito: è una notte nel bosco, qualunque sia il tema del telefono. */
:root{
  --night:#0a0f14; --panel:rgba(12,17,23,.88); --panel2:rgba(20,27,35,.94); --edge:#2c3a46; --line:rgba(255,190,120,.30);
  --ink:#eef1f4; --dim:#a7b2bc; --ember:#ff9b4d; --gold:#ffd27a; --moon:#c8d6df;
  --hp:#83d66f; --hp-mid:#e9c24b; --hp-low:#e65a3e; --fire:#ff7b3a; --norm:#a3acb5;
  --f-pix:"Pixelify Sans", ui-monospace, "Courier New", monospace;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night)}
body{color:var(--ink);font-family:var(--f-body);overflow:hidden}
.app{position:relative;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 52%,rgba(2,5,9,.55) 100%)}
/* in alto: schede e comandi della telecamera */
.top{position:absolute;z-index:6;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:6px;flex-wrap:wrap}
.tab,.cam{font:600 .92rem/1 var(--f-pix);color:var(--dim);background:var(--panel);border:2px solid var(--edge);border-radius:6px;padding:.5rem .7rem;
  cursor:pointer;touch-action:manipulation;min-height:2.4rem}
.tab[aria-pressed="true"]{color:#fff;border-color:#8a6a4a;background:#2a2018}
.cam[aria-pressed="true"]{color:var(--gold);border-color:#6b5a3a}
.tab:focus-visible,.cam:focus-visible,.move:focus-visible,.anim:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.camrow{position:absolute;z-index:5;left:max(12px,env(safe-area-inset-left,0px));top:calc(58px + env(safe-area-inset-top,0px));display:flex;gap:6px}
/* targhe della lotta */
.plate{position:absolute;z-index:3;width:min(15rem,calc(100% - 32px));padding:.45rem .7rem .55rem;background:var(--panel);border:1px solid var(--line);
  font-family:var(--f-pix);display:grid;gap:.25rem;clip-path:polygon(0 0,100% 0,100% 74%,94% 100%,0 100%)}
.plate .nm{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;white-space:nowrap}
.plate b{font-size:1.02rem;letter-spacing:.03em;text-transform:uppercase}
.plate span{font-size:.85rem;color:var(--dim)}
.hp{display:flex;align-items:center;gap:.4rem}
.hp small{font-size:.68rem;letter-spacing:.1em;color:var(--gold);font-weight:700}
.track{flex:1;height:.55rem;background:#232a31;border:1px solid #0b0f13;border-radius:2px;overflow:hidden}
.fill{height:100%;width:100%;background:var(--hp);transition:width .55s steps(18),background-color .2s}
.num{font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
.foe{top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.mine{left:max(12px,env(safe-area-inset-left,0px));bottom:calc(var(--dock,200px) + 10px)}
.dock{position:absolute;z-index:4;left:0;right:0;bottom:0;padding:.5rem max(12px,env(safe-area-inset-right,0px)) calc(.7rem + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:grid;gap:.45rem}
.msg{min-height:2.5rem;display:flex;align-items:center;padding:.4rem .8rem;background:var(--panel);border:1px solid var(--line);font-family:var(--f-pix);font-size:1rem;line-height:1.25}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.move{font-family:var(--f-pix);color:var(--ink);background:var(--panel2);border:1px solid var(--edge);border-left:4px solid var(--norm);text-align:left;
  padding:.4rem .6rem;cursor:pointer;display:grid;grid-template-columns:1fr auto;align-items:end;min-height:2.9rem;touch-action:manipulation}
.move.fire{border-left-color:var(--fire)}
.move b{font-size:1rem;font-weight:600;grid-column:1/-1}
.move .ty{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.move.fire .ty{color:var(--ember)}
.move .pp{font-size:.8rem;font-variant-numeric:tabular-nums}
.move:disabled{opacity:.42;cursor:default}
.hint{position:absolute;z-index:2;left:0;right:0;top:calc(104px + env(safe-area-inset-top,0px));text-align:center;color:var(--dim);font-size:.9rem;pointer-events:none;
  text-shadow:0 1px 2px #000;transition:opacity .8s;padding-inline:16px}
@media (max-aspect-ratio: 5/4){.mine{left:auto;right:max(12px,env(safe-area-inset-right,0px));width:min(13rem,56%)}
  .foe{top:calc(58px + env(safe-area-inset-top,0px));width:min(13rem,56%)}.hint{top:calc(130px + env(safe-area-inset-top,0px))}
  .camrow{top:auto;bottom:calc(var(--dock,200px) + 10px);flex-direction:column;align-items:flex-start}}
.err{position:absolute;inset:auto 16px 40% 16px;text-align:center;font-size:1.05rem}
/* telefono girato o schermo largo: le mosse a destra, le targhe in alto e in basso a sinistra */
@media (min-aspect-ratio: 5/4){
  .dock{left:auto;width:min(27rem,46%);padding-top:.3rem;gap:.35rem}
  .mine{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .msg{min-height:2.1rem;font-size:.95rem;padding:.3rem .7rem}
  .move{min-height:2.4rem;padding:.3rem .55rem}
  .hint{top:calc(14px + env(safe-area-inset-top,0px));left:50%;right:auto;transform:translateX(-50%);width:min(30rem,34%);font-size:.85rem}
}
@media (min-aspect-ratio: 5/4) and (max-height: 520px){
  .plate{padding:.3rem .55rem .4rem;gap:.15rem}.plate b{font-size:.92rem}
  .move .ty{display:none}.tab,.cam{min-height:2.1rem;padding:.35rem .55rem;font-size:.85rem}
  .camrow{top:calc(50px + env(safe-area-inset-top,0px))}.hint{display:none}
}
/* tutti gli sprite */
.gal{position:absolute;inset:0;z-index:5;overflow-y:auto;background:var(--night);
  padding:calc(66px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.galbar{position:absolute;z-index:5;left:0;right:0;top:0;height:calc(58px + env(safe-area-inset-top,0px));background:linear-gradient(var(--night) 78%,rgba(10,15,20,0))}
.gal h2{font-family:var(--f-pix);font-size:1.25rem;margin:1.6rem 0 .3rem;font-weight:700}
.gal h2:first-of-type{margin-top:.4rem}
.gal p{margin:0 0 .8rem;color:var(--dim);max-width:64ch;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{margin:0;background:#121921;border:1px solid var(--edge);border-radius:8px;padding:8px;display:grid;gap:6px;min-width:0}
.card canvas{width:100%;aspect-ratio:1/1;display:block;border-radius:4px;background:#1b252e;image-rendering:pixelated}
.card.wide{grid-column:span 2}.card.wide canvas{aspect-ratio:2/1}
.card figcaption{font-size:.82rem;color:var(--dim);line-height:1.3;overflow-wrap:anywhere}
.card figcaption b{display:block;color:var(--ink);font-family:var(--f-pix);font-weight:600;font-size:.92rem}
.anims{display:flex;gap:6px;flex-wrap:wrap;margin:-.2rem 0 .8rem}
.anim{font:600 .85rem/1 var(--f-pix);color:var(--ink);background:var(--panel2);border:1px solid var(--edge);border-left:3px solid var(--fire);border-radius:4px;padding:.45rem .7rem;cursor:pointer;min-height:2.2rem}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card.wide{grid-column:1/-1}}
</style>

<div class="app" id="app">
  <canvas id="gl" aria-label="Radura nel bosco di notte in 3D: due volpi di fuoco in lotta; trascina per girare intorno"></canvas>
  <div class="vig" id="vig"></div>
  <nav class="top" aria-label="Viste">
    <button type="button" class="tab" data-v="giro" aria-pressed="true">Bosco 360°</button>
    <button type="button" class="tab" data-v="sprite" aria-pressed="false">Tutti gli sprite</button>
  </nav>
  <div class="camrow" id="camrow">
    <button type="button" class="cam" id="bLotta">Vista lotta</button>
    <button type="button" class="cam" id="bGira" aria-pressed="true">Gira da solo</button>
  </div>
  <p class="hint" id="hint">Trascina per girare intorno · due dita o rotella per avvicinarti</p>
  <section class="plate foe" id="pFoe" aria-label="La volpe selvatica">
    <div class="nm"><b>Volpe di fuoco</b><span>Liv. 12</span></div>
    <div class="hp"><small>PS</small><div class="track"><div class="fill" id="hpFoe"></div></div></div>
  </section>
  <section class="plate mine" id="pMe" aria-label="La tua volpe">
    <div class="nm"><b>Volpe di fuoco</b><span>Liv. 14</span></div>
    <div class="hp"><small>PS</small><div class="track"><div class="fill" id="hpMe"></div></div></div>
    <div class="num" id="numMe">46/46</div>
  </section>
  <div class="dock" id="dock">
    <div class="msg" id="msg" role="status" aria-live="polite">Una volpe di fuoco selvatica ti sbarra la strada!</div>
    <div class="moves" id="moves" role="group" aria-label="Mosse">
      <button type="button" class="move fire" data-m="0"><b>Fiammata</b><span class="ty">Fuoco</span><span class="pp">15/15</span></button>
      <button type="button" class="move" data-m="1"><b>Graffio</b><span class="ty">Normale</span><span class="pp">35/35</span></button>
      <button type="button" class="move fire" data-m="2"><b>Braci</b><span class="ty">Fuoco</span><span class="pp">25/25</span></button>
      <button type="button" class="move fire" data-m="3"><b>Coda ardente</b><span class="ty">Fuoco</span><span class="pp">10/10</span></button>
    </div>
  </div>
  <section class="gal" id="gal" hidden aria-label="Tutti gli sprite"></section>
  <div class="galbar" id="galbar" hidden></div>
  <p class="err" id="err" hidden>Questo telefono non riesce a disegnare il bosco 3D (serve WebGL2). Gli sprite si vedono lo stesso nella seconda scheda.</p>
</div>

<script>
(()=>{
'use strict';
const D=__DATA__;
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp=(a,b,k)=>a+(b-a)*k,ez=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,cl=(v,a,b)=>v<a?a:v>b?b:v;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sub(a,b){return[a[0]-b[0],a[1]-b[1],a[2]-b[2]]}function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function nrm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]}
const M4={persp(fy,a,n,f){const t=1/Math.tan(fy/2),r=new Float32Array(16);r[0]=t/a;r[5]=t;r[10]=(f+n)/(n-f);r[11]=-1;r[14]=2*f*n/(n-f);return r},
  look(e,c,u){const z=nrm(sub(e,c)),x=nrm(cross(u,z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1])},
  mul(a,b){const r=new Float32Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];r[i*4+j]=s}return r}};
function load(src){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src})}

// ================================================================= la galleria (funziona anche senza 3D)
const galT=[];               // riquadri animati della galleria
function galleria(imgs){const g=$('gal');let h='';
  const sec=(t,p,items)=>{h+=`<h2>${t}</h2><p>${p}</p><div class="grid">`+items.map((it,i)=>`<figure class="card${it.wide?' wide':''}"><canvas data-k="${it.k}" aria-label="${it.nome}"></canvas><figcaption><b>${it.nome}</b>${it.info}</figcaption></figure>`).join('')+'</div>'};
  const V=D.volpe,items=[];let k=0;const reg=it=>{it.k=k++;galT.push(it);return it};
  for(const[vista,sh]of[['davanti',V.davanti],['spalle',V.spalle]])for(const[an,a]of Object.entries(sh.animazioni))
    items.push(reg({src:'volpe_'+vista,riga:a.riga,n:a.n,fps:a.fps,w:sh.frame_width,h:sh.frame_height,nome:(vista==='davanti'?'Davanti · ':'Di spalle · ')+an.replace(/_/g,' '),
      info:`${sh.frame_width}×${sh.frame_height} · ${a.n} fotogrammi a ${a.fps} al secondo`}));
  sec('La volpe di fuoco in lotta','Due fogli, una riga per animazione: fermo, occhi a metà e chiusi (solo davanti), attacco, colpito. Nel bosco si sceglie la vista giusta da dove guarda la telecamera: davanti o di spalle, girata a destra o a sinistra.',items);
  const E=D.env,grp={alberi:[],rocce:[],piante:[],a_terra:[],terreno:[],luce:[],particelle:[]};
  for(const m of E.sprite){const it={nome:m.nome.replace(/_/g,' '),info:`${m.frame_width}×${m.frame_height}${m.frames>1?' · '+m.frames+' fotogrammi':''}`};
    if(m.category==='tileset'){it.src='tile_'+m.nome;it.w=m.frame_width;it.h=m.frame_height;it.n=1;it.tile=true}
    else if(m.morbido){it.src='soft_'+m.nome;it.w=m.frame_width;it.h=m.frame_height;it.n=1;it.soft=true}
    else{const r=E.atlas.rect[m.nome];it.src='atlas';it.rect=r;it.w=m.frame_width;it.h=m.frame_height;it.n=m.frames||1;it.fps=m.fps||6}
    if(m.category==='env_tree')it.wide=m.frame_width>m.frame_height*1.2;
    grp[m.cartella].push(reg(it))}
  const T={alberi:['Alberi','Alberi spogli in pixel art: corteccia blu grigia in quattro toni, un filo di luce della luna in alto a destra, rametti di un pixel. Nel bosco guardano sempre la telecamera e ondeggiano piano in cima.'],
    rocce:['Sassi e ceppo','Sassi a faccette (ogni faccia un tono, muschio sopra) e un ceppo con gli anelli.'],
    piante:['Piante','Ciuffi d\'erba, felci, funghi che brillano azzurri, un cespuglio secco.'],
    a_terra:['A terra','Stese sul terreno, viste dall\'alto: radici e foglie secche.'],
    terreno:['Terreno','Piastrelle 64×64 che si ripetono senza cuciture: terra, radura di pietre piatte, muschio. Nel bosco si mescolano tra loro.'],
    luce:['Luna e luci','La luna in pixel art; le luci morbide che si sommano alla scena: alone, nebbia, raggio di luna, luce del fuoco, ombra.'],
    particelle:['Particelle','Lucciola, cenere e brace, in fotogrammi.']};
  for(const c of Object.keys(T))if(grp[c].length)sec(T[c][0],T[c][1],grp[c]);
  const fx=[];for(const[n,m]of Object.entries(D.fx))fx.push(reg({src:'fx_'+n,w:m.frame_width,h:m.frame_height,n:m.frames,fps:m.fps,nome:n.replace(/_/g,' '),info:`${m.frame_width}×${m.frame_height} · ${m.frames} fotogrammi`,wide:m.frames>4&&m.frame_width>=40}));
  sec('Effetti delle mosse','Palla di fuoco (Braci), sbuffi della Fiammata, esplosione (Coda ardente), graffio, scintilla del colpo.',fx);
  g.innerHTML=h;
  galT.forEach(it=>{it.cv=g.querySelector(`canvas[data-k="${it.k}"]`);it.g=it.cv.getContext('2d');it.img=imgs[it.src]})}
function disegnaGal(t){if($('gal').hidden)return;for(const it of galT){const c=it.cv,r=c.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)continue;
  const Dp=Math.min(2,devicePixelRatio||1),w=Math.round(r.width*Dp),h=Math.round(r.height*Dp);if(c.width!==w||c.height!==h){c.width=w;c.height=h}
  const g=it.g;g.clearRect(0,0,w,h);g.imageSmoothingEnabled=!!it.soft;if(!it.img)continue;
  const f=reduce?0:Math.floor(t*(it.fps||6))%Math.max(1,it.n);
  if(it.tile){const k=Math.max(1,Math.floor(Math.min(w,h)/(it.w*2)));for(let a=0;a<Math.ceil(w/(it.w*k));a++)for(let b=0;b<Math.ceil(h/(it.h*k));b++)g.drawImage(it.img,a*it.w*k,b*it.h*k,it.w*k,it.h*k);continue}
  let sx,sy;if(it.rect){sx=it.rect[0]+f*it.w;sy=it.rect[1]}else{sx=f*it.w;sy=(it.riga||0)*it.h}
  let k=Math.min((w-8)/it.w,(h-8)/it.h);if(!it.soft)k=Math.max(1,Math.floor(k));
  const dw=it.w*k,dh=it.h*k;g.drawImage(it.img,sx,sy,it.w,it.h,Math.round((w-dw)/2),Math.round((h-dh)/2),dw,dh)}}

// ================================================================= WebGL2
const cv=$('gl');
const gl=cv.getContext('webgl2',{antialias:true,alpha:false,stencil:true,premultipliedAlpha:false});
function prog(vs,fs){const s=(t,src)=>{const x=gl.createShader(t);gl.shaderSource(x,src);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x};
  const p=gl.createProgram();gl.attachShader(p,s(gl.VERTEX_SHADER,vs));gl.attachShader(p,s(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
  const U={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const u=gl.getActiveUniform(p,i);U[u.name.replace('[0]','')]=gl.getUniformLocation(p,u.name)}return{p,U}}
// pixel nitidi a qualunque grandezza: il pixel resta pieno, solo il bordo tra due pixel è sfumato di un pixel dello schermo
const NIT=`vec4 nit(sampler2D t,vec2 uv,vec2 sz){vec2 p=uv*sz;vec2 c=floor(p+0.5);vec2 dd=max(fwidth(p),vec2(1e-4));p=c+clamp((p-c)/dd,-0.5,0.5);return textureGrad(t,p/sz,dFdx(uv),dFdy(uv));}`;
const LUCI=`uniform vec3 uEye,uAmb,uFireC,uFogC;uniform vec4 uFire[2];uniform float uFogD;
vec3 fuoco(vec3 w){vec3 L=vec3(0.0);for(int i=0;i<2;i++){vec3 d=w-uFire[i].xyz;L+=uFireC*uFire[i].w*exp(-dot(d,d)*0.32);}return L;}
vec3 nebbia(vec3 c,vec3 w){float d=length(w-uEye);float f=1.0-exp(-pow(d*uFogD,1.7));f=max(f,0.0);return mix(c,uFogC,clamp(f,0.0,0.97));}`;
let P={};
function shaders(){
  // cielo: dal blu notte in alto alla nebbia all'orizzonte, alone della luna, stelline sopra la nebbia
  P.sky=prog(`#version 300 es
in vec2 aQ;out vec2 vN;void main(){vN=aQ*2.0-1.0;gl_Position=vec4(vN,0.9999,1.0);}`,`#version 300 es
precision highp float;in vec2 vN;out vec4 o;uniform vec3 uF,uR,uU,uMoon,uTop,uHor,uFogC;uniform vec2 uT;uniform float uTime;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
void main(){vec3 d=normalize(uF+uR*vN.x*uT.x+uU*vN.y*uT.y);float e=d.y;
  vec3 c=mix(uHor,uTop,smoothstep(0.0,0.6,e));c=mix(uFogC,c,smoothstep(-0.08,0.10,e));
  float m=max(dot(d,uMoon),0.0);c+=vec3(.42,.52,.64)*(0.10*pow(m,5.0)+0.16*pow(m,40.0));
  vec2 sp=vec2(atan(d.z,d.x)*58.0,asin(clamp(e,-1.0,1.0))*58.0);vec2 ce=floor(sp);float s=h21(ce);
  if(s>0.982&&e>0.10){vec2 f=fract(sp)-0.5;float tw=0.55+0.45*sin(uTime*1.7+s*60.0);c+=vec3(.72,.80,.9)*step(length(f),0.16)*tw*smoothstep(0.10,0.42,e)*(1.0-pow(m,6.0))*0.8;}
  o=vec4(c,1.0);}`);

function drawBB(lot,t,o){gl.useProgram(P.bb.p);gl.uniformMatrix4fv(P.bb.U.uVP,false,VP);gl.uniform3fv(P.bb.U.uRight,RIGHT);gl.uniform1f(P.bb.U.uShadow,0);setLuci(P.bb);

function particelle(){const Lb=LBRACI,Lf=LFX;Lb.clear();Lf.clear();
  for(const p of PART){if(p.t<0)continue;
    if(p.k==='brace'){const q=SPR.brace,k=p.t/p.max,f=Math.min(4,(k*5)|0),ps=q.ps*p.s,fw=q.w,r=q.rect,du=r[2]-r[0];
      Lb.push(p.x,p.y,p.z,fw*ps,q.h*ps,fw*ps/2,q.h*ps/2,r[0]+du*f,r[1],r[0]+du*(f+1),r[3],1,0,0,0)}

    Lb.push(x,y,z,sl,sl,sl/2,sl/2,rl[0]+dl*f,rl[1],rl[0]+dl*(f+1),rl[3],1,0,0,0)}
  gl.useProgram(P.bb.p);gl.uniformMatrix4fv(P.bb.U.uVP,false,VP);gl.uniform3fv(P.bb.U.uRight,RIGHT);gl.uniform1f(P.bb.U.uShadow,0);setLuci(P.bb);gl.uniform1f(P.bb.U.uSelf,1);

function veli(){const L=LADD[0];L.clear();

  const nb=SOFTR.nebbia;for(const w of WISP){const x=w.x+Math.sin(T*w.v+w.p)*1.2,z=w.z+Math.cos(T*w.v*.8+w.p)*1.2,a=w.a*(reduce?1:.75+.25*Math.sin(T*.3+w.p));
    L.push(x,w.y+w.h/2,z,0,w.w,w.h,0,0,...nb,.62,.70,.76,a)}
  WISP.sort((a,b)=>Math.hypot(b.x-EYE[0],b.z-EYE[2])-Math.hypot(a.x-EYE[0],a.z-EYE[2]));

  gl.enable(gl.BLEND);gl.depthMask(false);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.uniform1f(P.flat.U.uMode,2);L.upload();L.draw();

    L.push(p[0]+FWD[0]*.45,p[1]+.15,p[2]+FWD[2]*.45,0,3.0*fl,2.8*fl,0,0,...lf,1,.5,.18,.34*c.alpha)}
  for(const e of ENV){if(!e.q.m.brilla)continue;const d=Math.hypot(e.x-EYE[0],e.z-EYE[2]);if(d>26)continue;const fl=reduce?1:.8+.2*Math.sin(T*1.3+e.x);L.push(e.x,.18*e.s,e.z,0,.9,.9,0,0,...al,.35,.88,.92,.55*fl)}
  for(const p of PART){if(p.t<0)continue;const k=p.t/p.max;if(p.k==='brace'){L.push(p.x,p.y,p.z,0,.22*p.s,.22*p.s,0,0,...lf,1,.6,.25,(1-k)*.8)}
    else if(p.k==='fx'&&p.nome!=='graffio'){const s=(D.fx[p.nome].frame_width*PSV*p.s)*1.8;L.push(p.x,p.y,p.z,0,s,s,0,0,...lf,1,.55,.2,(1-k)*.6)}}
  for(const f of FLIES){const[x,y,z,a]=flyPos(f);L.push(x,y,z,0,.32,.32,0,0,...al,.75,1,.5,a)}
  for(let i=0;i<3;i++){const d=7+i*2.6,x=MOON[0]*-2+i*1.4-1.5,z=-3.2-i*1.8,a=.05+.02*Math.sin(T*.4+i*2);L.push(x,3.6,z,0,1.8,9,0,MOON[0]*3.2,...rg,.75,.85,.95,a)}
  gl.blendFunc(gl.ONE,gl.ONE);gl.uniform1f(P.flat.U.uMode,1);L.upload();L.draw();gl.depthMask(true);gl.disable(gl.BLEND)}

// ================================================================= tempo
function tick(dt){T+=dt;
  if(CAM.tw){const k=Math.min(1,(T-CAM.tw.t0)/CAM.tw.d);CAM.tw.f(k);if(k>=1)CAM.tw=null}
  CAM.idle+=dt;if(CAM.auto&&!busy&&CAM.idle>5&&!CAM.tw&&!reduce)CAM.th+=dt*0.12;
  for(const c of[FOE,ME]){c.flash=Math.max(0,c.flash-dt*3.2);c.shake=Math.max(0,c.shake-dt*10);c.blinkT-=dt;if(c.blinkT<-.22)c.blinkT=2+Math.random()*2.5;
    if(!reduce&&Math.random()<dt*6*c.alpha)brace(c)}
  for(let i=PART.length-1;i>=0;i--){const p=PART[i];p.t+=dt;if(p.t>p.max){PART.splice(i,1);continue}if(p.t<0)continue;
    if(p.k==='brace'){p.x+=p.vx*dt+Math.sin(T*3+i)*.004;p.y+=p.vy*dt;p.z+=p.vz*dt}
    else{p.vy-=(p.g||0)*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.drag){p.vx*=1-dt*p.drag;p.vz*=1-dt*p.drag}}}
  if(!reduce)for(const a of ASH){a.y-=a.v*dt;a.x+=Math.sin(T*.7+a.p)*.12*dt+.05*dt;if(a.y<0){a.y=8;a.x=CAM.tgt[0]+(Math.random()-.5)*22;a.z=CAM.tgt[2]+(Math.random()-.5)*22}}}

let LENTO=1;     // per le prove: >1 rallenta tutto (la scena e la lotta)
const sleep=ms=>new Promise(r=>setTimeout(r,(reduce?Math.min(ms,250):ms)*LENTO));
function tween(ms,fn){return new Promise(r=>{const t0=performance.now();const st=()=>{const k=Math.min(1,(performance.now()-t0)/((reduce?Math.min(ms,120):ms)*LENTO));fn(k);k<1?requestAnimationFrame(st):r()};st()})}
const MOVES=[{n:'Fiammata',pp:15,max:15,pow:13,fx:'stream'},{n:'Graffio',pp:35,max:35,pow:7,fx:'slash'},{n:'Braci',pp:25,max:25,pow:9,fx:'balls'},{n:'Coda ardente',pp:10,max:10,pow:17,fx:'burst'}];

async function lunge(c,amt){play(c,'attacco');await sleep(240);const dx=c.other[0]-c.pos[0],dz=c.other[2]-c.pos[2],l=Math.hypot(dx,dz);
  await tween(120,k=>{c.lx=dx/l*amt*ez(k);c.lz=dz/l*amt*ez(k)})}
async function back(c){const x0=c.lx,z0=c.lz;await tween(260,k=>{c.lx=x0*(1-ez(k));c.lz=z0*(1-ez(k))})}
function fx(kind,a,b){const A=at(a,punti(a).bocca),B=at(b,punti(b).corpo);
  if(kind==='stream')return new Promise(async r=>{for(let i=0;i<26;i++){const tt=.42+Math.random()*.12;
      fxSprite('fiammata',A[0],A[1],A[2],{vx:(B[0]-A[0])/tt+(Math.random()-.5)*.6,vy:(B[1]-A[1])/tt+(Math.random()-.5)*.5+.6,vz:(B[2]-A[2])/tt+(Math.random()-.5)*.6,g:1.6,max:tt*1.1,s:.55+Math.random()*.45,fuoco:4});
      if(i%3===0)await sleep(30)}await sleep(260);r()});
  if(kind==='balls')return new Promise(async r=>{for(let j=0;j<3;j++){const tt=.5,o=(j-1)*.35;
      fxSprite('palla_di_fuoco',A[0],A[1],A[2],{vx:(B[0]-A[0])/tt+RIGHT[0]*o,vy:(B[1]-A[1])/tt+tt*9.8/2,vz:(B[2]-A[2])/tt+RIGHT[2]*o,g:9.8,max:tt,loop:true,s:1.4});
      await sleep(140)}await sleep(420);r()});
  if(kind==='slash'){fxSprite('graffio',B[0],B[1]+.1,B[2],{s:1.6,mir:b.mir?1:0});return sleep(380)}
  if(kind==='burst'){const f=base(b);fxSprite('esplosione',f[0],f[1]+.55,f[2],{s:1.5});
    for(let i=0;i<14;i++){const a_=i/14*6.283;fxSprite('fiammata',f[0]+Math.cos(a_)*.4,f[1]+.2,f[2]+Math.sin(a_)*.4,{vx:Math.cos(a_)*.5,vy:1.2+Math.random()*1.2,vz:Math.sin(a_)*.5,max:.55+Math.random()*.3,s:.7,t:-Math.random()*.15})}
    return sleep(620)}}
async function hit(c,dmg){play(c,'colpito');c.flash=1;c.shake=4;const p=at(c,punti(c).corpo);fxSprite('scintilla',p[0],p[1],p[2],{s:2.2});
  for(let i=0;i<10;i++)PART.push({k:'brace',x:p[0],y:p[1],z:p[2],vx:(Math.random()-.5)*2.2,vy:Math.random()*1.8,vz:(Math.random()-.5)*2.2,t:0,max:.5+Math.random()*.4,s:.7});
  await sleep(160);c.flash=.7;await sleep(120);c.hp=Math.max(0,c.hp-dmg);hpUI();await sleep(620)}
async function ko(c){await tween(900,k=>{c.sink=k*.5;c.alpha=1-k});for(let i=0;i<14;i++)brace(c)}
async function reset(){FOE.hp=FOE.max;ME.hp=ME.max;MOVES.forEach(m=>m.pp=m.max);ppUI();FOE.sink=0;ME.sink=0;ME.alpha=1;hpUI();
  await tween(700,k=>{FOE.alpha=k});say('Un\'altra volpe di fuoco esce dalla nebbia!');await sleep(1200);say('Che cosa fa la tua volpe?');lock(false)}
async function turn(i){const m=MOVES[i];if(busy||m.pp<=0)return;lock(true);m.pp--;ppUI();
  say('La tua volpe usa '+m.n+'!');await sleep(350);await lunge(ME,.55);await fx(m.fx,ME,FOE);await back(ME);
  await hit(FOE,Math.round(m.pow*(.85+Math.random()*.15)));
  if(FOE.hp<=0){say('La volpe di fuoco selvatica non ce la fa più!');await ko(FOE);await sleep(1300);await reset();return}
  const e=FOE_MOVES[(Math.random()*FOE_MOVES.length)|0];say('La volpe selvatica usa '+e.n+'!');await sleep(450);
  await lunge(FOE,.45);await fx(e.fx,FOE,ME);await back(FOE);await hit(ME,Math.round(e.pow*(.85+Math.random()*.15)));
  if(ME.hp<=0){say('La tua volpe non ce la fa più! Si riposa e ci riprova.');await sleep(1500);FOE.alpha=0;await reset();return}
  say('Che cosa fa la tua volpe?');lock(false)}
btns.forEach((b,i)=>b.addEventListener('click',()=>turn(i)));
window.__bosco={cam:CAM,lotta:LOTTA,volpi:()=>[FOE,ME].map(c=>({vista:c.vista,mir:c.mir,anim:c.anim})),lento:v=>{LENTO=v}};

// ================================================================= schede
let vista='giro';
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{vista=b.dataset.v;document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  const g=vista==='sprite';$('gal').hidden=!g;$('galbar').hidden=!g;for(const id of['pFoe','pMe','dock','camrow','hint','vig'])$(id).hidden=g;cv.hidden=g}));

// ================================================================= avvio
(async()=>{
  const imgs={};const add=async(k,src)=>{imgs[k]=await load(src)};const jobs=[];
  jobs.push(add('atlas',D.env.atlas.src));for(const[k,v]of Object.entries(D.env.tiles))jobs.push(add('tile_'+k,v));
  for(const[k,v]of Object.entries(D.env.soft))jobs.push(add('soft_'+k,v.src));for(const[k,v]of Object.entries(D.fx))jobs.push(add('fx_'+k,v.src));
  jobs.push(add('volpe_davanti',D.volpe.davanti.src),add('volpe_spalle',D.volpe.spalle.src));await Promise.all(jobs);
  galleria(imgs);
  (function gl_(){disegnaGal(performance.now()/1000);requestAnimationFrame(gl_)})();
  if(!gl){$('err').hidden=false;for(const id of['pFoe','pMe','dock','camrow','hint'])$(id).hidden=true;return}
  try{
    ATL=tex(imgs.atlas,{mip:true,maxl:2});for(const k of Object.keys(D.env.tiles))TILES[k]=tex(imgs['tile_'+k],{mip:true,rep:true,maxl:3});
    // luci morbide in un'immagine sola
    {const ks=Object.keys(D.env.soft),c=document.createElement('canvas');let w=0,h=0;for(const k of ks){w+=imgs['soft_'+k].width+4;h=Math.max(h,imgs['soft_'+k].height)}c.width=w;c.height=h;const g=c.getContext('2d');let x=0;
      for(const k of ks){const im=imgs['soft_'+k];g.drawImage(im,x,0);SOFTR[k]=[(x+.5)/w,.5/h,(x+im.width-.5)/w,(im.height-.5)/h];x+=im.width+4}SOFT=tex(c,{})}
    // effetti delle mosse in un'immagine sola
    {const ks=Object.keys(D.fx),c=document.createElement('canvas');let w=0,h=0;for(const k of ks){w=Math.max(w,imgs['fx_'+k].width);h+=imgs['fx_'+k].height+4}c.width=w;c.height=h;const g=c.getContext('2d');let y=0;
      for(const k of ks){const im=imgs['fx_'+k];g.drawImage(im,0,y);FXR[k]=[0,y/h,im.width/w,(y+im.height)/h];y+=im.height+4}FXT=tex(c,{})}
    for(const k of['davanti','spalle']){VOLPE[k]=D.volpe[k];VOLPE[k].tex=tex(imgs['volpe_'+k],{})}
    costruisci();preparaGL();resize();hpUI();ppUI();lock(true);FOE.alpha=0;
    let nf=0,acc=0;
    (function frame(){const tn=performance.now(),raw=(tn-last)/1000,dt=Math.min(.05,raw)/LENTO;last=tn;
      if(vista==='giro'){tick(reduce?0:dt);camera();render();
        // dopo un secondo e mezzo di prova: se i fotogrammi sono lenti, si disegna con meno pixel
        if(QUAL>.6&&raw<.5){nf++;acc+=raw;if(nf>=90){if(acc/nf>1/38){QUAL=Math.max(.6,QUAL*.75);resize()}nf=0;acc=0}}}
      requestAnimationFrame(frame)})();
    tween(900,k=>{FOE.alpha=k}).then(()=>sleep(700)).then(()=>{say('Che cosa fa la tua volpe?');lock(false)});
  }catch(e){console.error(e);$('err').hidden=false}
})();
})();
</script>
