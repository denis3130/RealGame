<title>La Discesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@600;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#050406;--ink:#0b0907;--fg:#eee4d0;--muted:#9c9080;--gold:#ffcf4a;--amber:#ffb347;--pill:rgba(10,8,8,.86);--paper:#e6d8b6;--disp:'Lilita One',system-ui,sans-serif;--body:'Baloo 2',system-ui,sans-serif}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font:600 14px/1.35 var(--body);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;top:0;left:50%;transform:translateX(-50%);display:block;z-index:0}
#world{position:relative;margin:0 auto;z-index:1}
header{position:fixed;top:0;left:0;right:0;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 18px;background:linear-gradient(rgba(4,3,5,.95),rgba(4,3,5,.75) 65%,transparent);pointer-events:none}
.hd{max-width:448px;margin:0 auto;display:flex;align-items:center;gap:10px}
.hd .tt{flex:1;min-width:0}
h1{margin:0;font:400 22px/1 var(--disp);letter-spacing:.5px;text-shadow:0 2px 0 var(--ink)}
#zone{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px}
.chip{background:var(--pill);border:2px solid #2a2420;border-radius:999px;padding:3px 9px;font:400 15px/1.1 var(--disp);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip i{font-style:normal;color:var(--gold)}
.light{max-width:448px;margin:8px auto 0;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.bar{flex:1;height:7px;border-radius:9px;background:#1a1512;border:2px solid #000;overflow:hidden}
.bar b{display:block;height:100%;width:80%;background:linear-gradient(90deg,#b8611c,#ffd27a);box-shadow:0 0 10px #ffb347;transition:width 1.2s}
.node{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;color:inherit;font:inherit}
.disc{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font:400 30px var(--disp);color:#fff;border:4px solid var(--ink);background:radial-gradient(circle at 35% 30%,var(--c1),var(--c2) 75%);box-shadow:inset 0 -6px 0 rgba(0,0,0,.3),0 6px 0 var(--ink),0 0 26px rgba(var(--g),.35);text-shadow:0 3px 0 var(--ink)}
.strato.locked .disc{background:radial-gradient(circle at 35% 30%,#4a443e,#1a1715 75%);color:#857a6c;box-shadow:inset 0 -6px 0 rgba(0,0,0,.3),0 6px 0 var(--ink)}
.strato.far{opacity:.32}
.strato.cur .disc{animation:pul 1.8s ease-in-out infinite}
@keyframes pul{50%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.3),0 6px 0 var(--ink),0 0 0 7px rgba(var(--g),.25),0 0 40px rgba(var(--g),.6)}}
.stars{position:absolute;top:-15px;left:50%;transform:translateX(-50%);display:flex;font-size:19px;line-height:1;white-space:nowrap}
.stars span{color:#2e2924;text-shadow:0 2px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink)}
.stars span.on{color:var(--gold)}
.stars span:nth-child(2){transform:translateY(-5px)}
.lbl{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);white-space:nowrap;font:400 15px/1.1 var(--disp);background:var(--pill);padding:4px 10px 5px;border-radius:10px;text-shadow:0 2px 0 var(--ink)}
.lbl small{display:block;font:700 11px/1.15 var(--body);color:#bfb39d;text-shadow:none;text-align:center}
.page{width:30px;height:34px;border-radius:5px;display:grid;place-items:center;font:400 13px var(--disp);color:#5a4630;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);rotate:-9deg}
.page.no{background:#221d1a;color:#6d6257;font-size:11px}
.page.new{animation:pop .6s}
@keyframes pop{40%{scale:1.5}}
.badge{font:400 12px/1 var(--disp);padding:3px 7px;border-radius:999px;background:var(--pill);border:2px solid #2a2420;color:var(--muted);white-space:nowrap}
.badge.on{color:var(--gold);border-color:#6b4f1c}
#hero{position:absolute;width:48px;height:60px;transform:translate(-50%,-88%);pointer-events:none;z-index:3}
#hero canvas{width:48px;height:60px;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(transparent,rgba(4,3,5,.92) 40%)}
.foot .in{max-width:448px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;font:400 19px/1 var(--disp);color:#fff;padding:13px 10px 15px;border:3px solid var(--ink);border-radius:14px;cursor:pointer;text-shadow:0 2px 0 var(--ink);box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 4px 0 var(--ink);background:linear-gradient(#e8a23a,#a85a14)}
.btn.sec{flex:.55;background:linear-gradient(#5b524a,#38312b)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 1px 0 var(--ink)}
.btn:disabled{filter:grayscale(1) brightness(.6)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;max-width:448px;margin:0 auto;box-sizing:border-box;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 22px);background:#15110f;border:3px solid #000;border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px #000;transform:translateY(105%);transition:transform .3s}
#sheet.show{transform:none}
#sheet .k{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
#sheet h2{margin:2px 0 8px;font:400 24px/1.1 var(--disp);text-wrap:balance}
#sheet p{margin:0 0 10px;max-width:60ch}
#sheet .diary{background:var(--paper);color:#3c2e1e;border:3px solid var(--ink);border-radius:8px;padding:12px 14px;font:700 15px/1.45 var(--body);font-style:italic;rotate:-.6deg}
#sheet .x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:2px solid #3a322c;background:#221c18;color:var(--fg);font-size:16px;cursor:pointer}
#sheet .btn{width:100%;margin-top:4px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:9;transform:translate(-50%,-20px);opacity:0;transition:.35s;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center;font:400 17px/1.2 var(--disp);color:#2a1a08;background:linear-gradient(#ffe08a,#f0a83a);border:3px solid var(--ink);border-radius:14px;padding:9px 16px;box-shadow:0 5px 0 var(--ink),0 0 30px rgba(255,190,80,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.paper{background:var(--paper);color:#3c2e1e;box-shadow:0 5px 0 var(--ink)}
</style>

<header><div class="hd"><div class="tt"><h1>La Discesa</h1><div id="zone">Superficie</div></div>
<div class="chips"><span class="chip" id="cD">0 m</span><span class="chip"><i>★</i> <span id="cS">0</span></span><span class="chip" id="cP">📜 0/13</span></div></div>
</header>
<canvas id="cv"></canvas>
<div id="world"><div id="hero"><canvas id="hc" width="96" height="120"></canvas></div></div>
<div class="foot"><div class="in"><button class="btn sec" id="bR">Da capo</button><button class="btn" id="bW">Scendi più giù</button></div></div>
<div id="sheet" role="dialog" aria-labelledby="shT"><button class="x" id="shX" aria-label="Chiudi">✕</button><div class="k" id="shK"></div><h2 id="shT"></h2><div id="shB"></div></div>
<div id="toast"></div>

<script>
(()=>{
const STR=[
 {n:'Cripta di Muschio',ch:0,acc:'#8fd14f',d:40},
 {n:'Cuore del Vulcano',ch:1,acc:'#ff8a3c',d:95},
 {n:'Palude delle Lucciole',ch:2,acc:'#c8f04a',d:160},
 {n:'Grotte di Brina',ch:3,acc:'#9fe6ff',d:240},
 {n:'Cripta Risvegliata',ch:0,acc:'#b98ad8',d:330},
 {n:'Vulcano Furioso',ch:1,acc:'#ff5a3c',d:430},
 {n:'Palude Avvelenata',ch:2,acc:'#a86ad0',d:540},
 {n:'Ghiacciaio Eterno',ch:3,acc:'#7f9cff',d:660},
 {n:'Cripta delle Ombre',ch:0,acc:'#6a7cd8',d:790},
 {n:'Forgia Sepolta',ch:1,acc:'#5fd0a8',d:930},
 {n:'Palude Maledetta',ch:2,acc:'#c06ad0',d:1080},
 {n:'Gelo Senza Fondo',ch:3,acc:'#8a9ad8',d:1240}];
const ROCK=[[60,64,50],[66,48,40],[54,58,44],[52,62,74]];
const DIARY=[
 "Giorno 1. Ho legato la corda all'argano e acceso la lanterna. Scendo solo un pezzetto. Torno per cena.",
 "Qui le pareti sono calde come un forno. Non ho fame. Strano: sono già passate ore?",
 "Le lucciole mi seguono. Credo che vogliano dirmi qualcosa. O forse avvisarmi.",
 "Ghiaccio dappertutto. Il fiato fa le nuvolette. Ho sentito dei passi sopra di me. Ma sopra non c'è nessuno.",
 "Qualcuno ha appeso delle lanterne quaggiù, tanto tempo fa. Le accendo una a una, così troverò la strada per tornare.",
 "La lanterna fa meno luce. O è il buio che è diventato più forte?",
 "Sul muro qualcuno ha contato i giorni. Sono tantissimi. Non li ho contati tutti.",
 "Ho smesso di scrivere i giorni. Quaggiù non ci sono giorni.",
 "Ci sono occhi nel buio. Non si avvicinano alla luce. Tieni sempre accesa la luce.",
 "Ho sentito qualcuno chiamare il mio nome. Veniva dal basso.",
 "La corda è finita. Continuo senza.",
 "Se stai leggendo, sei arrivato fin qui. Non fermarti. Il fondo è vicino. Lo sento."];
const LAMPS=[{at:4,r:'300 oro'},{at:8,r:'Cassa d\'argento'},{at:12,r:'50 cristalli'},{at:16,r:'Cornice «Esploratore»'},{at:20,r:'Cassa d\'oro'},{at:24,r:'Compagno: Falena di luce'},{at:28,r:'150 cristalli'},{at:32,r:'Cassa leggendaria'},{at:36,r:'La lanterna di Ilda (aspetto per l\'eroe)'}];
const SEQ=[3,2,3,3,1,3,2,3,3,2,3,3];
const NAME_RANGE=1; // names visible only up to cur+NAME_RANGE

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),world=$('world'),heroEl=$('hero');
const dk=document.createElement('canvas'),dctx=dk.getContext('2d');
let W,VH,H,dpr,TOPH=440,SH=360,SURF=290,FONDO=700,EL,ER,BC,WC,DEC=[],T=0;
const S={stars:[3,3,2,0,0,0,0,0,0,0,0,0],cur:3};
let heroS=S.cur+1,heroTo=S.cur+1,lampA=[],follow=0;
const total=()=>S.stars.reduce((a,b)=>a+b,0);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mk=seed=>{let s=seed%2147483647||1;return()=>(s=s*16807%2147483647)/2147483647};
const depthT=y=>clamp((y-TOPH)/(12*SH),0,1);
const sy=i=>TOPH+i*SH+SH*.5;
const FY=()=>TOPH+12*SH+250;
const P=y=>H-y; // world depth -> page y (depth grows upward on screen)
const U=(x,y,fn)=>{ctx.save();ctx.translate(x,y);ctx.scale(1,-1);ctx.translate(-x,-y);fn();ctx.restore()};
const wallBase=y=>y<SURF?0:30+44*depthT(y);
const idx=y=>clamp((y/3)|0,0,EL.length-1);
const Lw=y=>EL[idx(y)],Rw=y=>ER[idx(y)];
const hex=h=>[1,3,5].map(k=>parseInt(h.substr(k,2),16));
const rgb=(c,a)=>a==null?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const ring=i=>Math.floor(i/4);
function rockOf(i){const r=ROCK[STR[i].ch];return mix(mul(r,[1,.72,.52][ring(i)]),[10,9,12],depthT(sy(i))*.35)}
function sx(i){const y=sy(i),half=W/2-wallBase(y)-16,amp=Math.max(0,half-92);return W/2+amp*[-1,.9,-.7,1,-.9,.6,-1,.85,-.6,.9,-.7,0][i]}
function spot(i){ // hero standing spot (path point)
  if(i<=0)return{x:W/2,y:110};
  if(i>12)return{x:W/2-58,y:FY()+6};
  const x=sx(i-1),side=x<W/2+1?1:-1;return{x:x+side*58,y:sy(i-1)+8}}
function pathPt(s){const k=clamp(Math.floor(s),0,12),t=clamp(s-k,0,1),a=spot(k),b=spot(k+1),dy=b.y-a.y;
  const c1={x:a.x,y:a.y+dy*.55},c2={x:b.x,y:b.y-dy*.55},u=1-t;
  return{x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y}}

function build(){
  W=Math.min(innerWidth,480);VH=innerHeight;dpr=Math.min(devicePixelRatio||1,2);H=TOPH+12*SH+FONDO;
  cv.width=dk.width=W*dpr;cv.height=dk.height=VH*dpr;cv.style.width=W+'px';cv.style.height=VH+'px';
  world.style.width=W+'px';world.style.height=H+'px';
  const r=mk(7),n=Math.ceil(H/3)+2,kn=Math.ceil(n/16)+3,kl=[],kr=[];
  for(let k=0;k<kn;k++){kl.push(r());kr.push(r())}
  EL=new Float32Array(n);ER=new Float32Array(n);BC=[];WC=[];
  for(let k=0;k<n;k++){const y=k*3,t=depthT(y),u=k/16,i0=Math.floor(u),f=u-i0,s=(1-Math.cos(f*Math.PI))/2,amp=8+14*t,b=wallBase(y);
    EL[k]=y<SURF?0:b+amp*(kl[i0]*(1-s)+kl[i0+1]*s)+(r()-.5)*3;ER[k]=y<SURF?0:b+amp*(kr[i0]*(1-s)+kr[i0+1]*s)+(r()-.5)*3;
    const v=(y-TOPH)/SH-.5,a=clamp(Math.floor(v),0,11),bb=clamp(a+1,0,11),ft=clamp(v-a,0,1);
    let c=y<TOPH?rockOf(0):mix(rockOf(a),rockOf(bb),ft);
    if(y>TOPH+12*SH)c=mix(c,[6,5,8],clamp((y-TOPH-12*SH)/300,0,1));
    c=mul(c,1-.3*t);BC.push(rgb(c));WC.push(rgb(mul(c,.62)))}
  DEC=STR.map((s,i)=>{const r=mk(i*977+31),y0=TOPH+i*SH,o={stones:[],lines:[],bits:[],chains:[],cages:[],eyes:[],flies:[],drips:[]};
    const X=(y,m=10)=>Lw(y)+m+r()*(W-Lw(y)-Rw(y)-2*m);
    for(let k=0;k<34;k++){const y=y0+r()*SH;o.stones.push([X(y),y,6+r()*18,4+r()*10,r()])}
    for(let k=0;k<3;k++){const y=y0+30+r()*(SH-60);o.lines.push([y,r()*6.28,4+r()*6])}
    const ch=s.ch;
    for(let k=0;k<(ch==1?5:14);k++){const y=y0+r()*SH,x=X(y),pts=[[x,y]];let px=x,py=y;
      for(let j=0;j<5+r()*5;j++){px+=(r()-.5)*26;py+=ch==1?(r()-.3)*22:6+r()*14;pts.push([px,py])}o.bits.push({x,y,pts,s:r()})}
    if(ring(i)>=1)for(let k=0;k<2+ring(i);k++){const x=X(y0),len=60+r()*140;o.chains.push([x,y0+r()*SH*.4,len,r()*6])}
    if(ring(i)>=2||i==6)for(let k=0;k<(i>=8?2:1);k++){const x=X(y0,40);o.cages.push([x,y0+20+r()*SH*.5,50+r()*60,r()*6])}
    if(i>=6)for(let k=0;k<Math.min(4,1+(i-6));k++){const y=y0+r()*SH,side=r()<.5;o.eyes.push([side?Lw(y)*.55:W-Rw(y)*.55,y,r()*6.28,i>=9&&r()<.35])}
    if(ch==2)for(let k=0;k<12;k++){o.flies.push([X(y0+SH/2),y0+r()*SH,r()*6.28,r()])}
    if(ch==2||ch==3)for(let k=0;k<5;k++){const y=y0+r()*SH;o.drips.push([X(y),y,r()*3])}
    return o});
  lampA=LAMPS.map((l,k)=>total()>=l.at?1:0);
  makeBeacons();makeNodes();drawHeroSprite();
}
const lampPos=k=>{const y=TOPH+(k+.7)*(12*SH/9.4),left=k%2==0;return{x:left?Lw(y)+16:W-Rw(y)-16,y,left}};

// ---------- DOM nodes ----------
let nodes=[];
function makeNodes(){
  nodes.forEach(n=>n.remove());nodes=[];
  const add=(el,x,y)=>{el.style.left=x+'px';el.style.top=y+'px';world.appendChild(el);nodes.push(el);return el};
  STR.forEach((s,i)=>{const b=document.createElement('button'),done=i<S.cur,cur=i==S.cur,known=i<=S.cur+NAME_RANGE;
    b.className='node strato'+(done||cur?'':' locked')+(cur?' cur':'')+(known?'':' far');
    const c=hex(s.acc);b.style.setProperty('--c1',s.acc);b.style.setProperty('--c2',rgb(mul(c,.38)));b.style.setProperty('--g',c.join(','));
    b.innerHTML=`<div class="disc">${known?i+1:'?'}</div><div class="stars">${[0,1,2].map(k=>`<span class="${S.stars[i]>k?'on':''}">★</span>`).join('')}</div><div class="lbl">${known?s.n:'???'}<small>−${known?s.d:'???'} m</small></div>`;
    b.setAttribute('aria-label',known?s.n:'Strato sconosciuto');b.onclick=()=>openStrato(i);add(b,sx(i),P(sy(i)));
    const x=sx(i),side=x<W/2+1?-1:1,p=document.createElement('button');p.className='node page'+(S.stars[i]==3?'':' no');p.textContent=S.stars[i]==3?'📜':'3★';
    p.setAttribute('aria-label','Pagina del diario '+(i+1));p.onclick=()=>openPage(i);p.dataset.pg=i;add(p,x+side*44,P(sy(i))-40)});
  LAMPS.forEach((l,k)=>{const p=lampPos(k),b=document.createElement('button');b.className='node badge'+(total()>=l.at?' on':'');b.innerHTML=`★ ${l.at}`;
    b.setAttribute('aria-label','Lanterna '+l.at+' stelle');b.onclick=()=>openLamp(k);add(b,p.x+(p.left?6:-6),P(p.y)+44)});
  const f=document.createElement('button'),fk=S.cur>=12;f.className='node strato'+(fk?' cur':' locked far');
  f.style.setProperty('--c1','#d8d2ff');f.style.setProperty('--c2','#2a2640');f.style.setProperty('--g','200,195,255');
  f.innerHTML=`<div class="disc">?</div><div class="lbl">Il Fondo<small>−???? m</small></div>`;f.onclick=openFondo;add(f,W/2,P(FY()));
  if(fk){const p=document.createElement('button');p.className='node page';p.textContent='📜';p.onclick=()=>openPage(12);add(p,W/2+46,P(FY())-40)}
  hud();
}
function hud(){const hs=Math.min(S.cur,12),y=S.cur>=12?FY():sy(S.cur);
  $('cD').textContent=(S.cur>=12?'????':S.cur==0?0:STR[S.cur-1].d)+' m';$('cS').textContent=total();
  $('cP').textContent='📜 '+(S.stars.filter(v=>v==3).length+(S.cur>=12?1:0))+'/13';
  $('zone').textContent=S.cur>=12?'Il Fondo':S.cur==0?'Ingresso della cripta':STR[hs].n+' · strato '+(hs+1);
  $('bW').disabled=S.cur>=12;$('bW').textContent=S.cur>=12?'Sei sul fondo':'Scendi più giù'}

// ---------- hero sprite ----------
function drawHeroSprite(){const c=$('hc').getContext('2d');c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,48,60);c.lineJoin='round';c.lineCap='round';
  const ink='#0b0907';c.lineWidth=2.6;c.strokeStyle=ink;
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(24,57,13,3,0,0,7);c.fill();
  c.fillStyle='#2d2a26';[[17,47],[26,47]].forEach(([x,y])=>{c.beginPath();c.roundRect(x,y,6,9,2);c.fill();c.stroke()});
  c.fillStyle='#3b8a45';c.beginPath();c.moveTo(14,27);c.lineTo(34,27);c.lineTo(38,50);c.quadraticCurveTo(24,54,10,50);c.closePath();c.fill();c.stroke();
  c.strokeStyle='#2f7038';c.beginPath();c.moveTo(24,31);c.lineTo(24,50);c.stroke();
  c.strokeStyle=ink;c.lineWidth=5;c.beginPath();c.moveTo(34,32);c.lineTo(40,37);c.stroke();c.strokeStyle='#3b8a45';c.lineWidth=2.6;c.stroke();

function wowBack(y0,y1){for(let i=0;i<12;i++){const yA=TOPH+i*SH;if(yA>y1+60||yA+SH<y0-140)continue;for(const b of DEC[i].bea)drawBeacon(b,i)}}
function wowHoles(Q){for(let i=0;i<Math.min(S.cur+1,12);i++)for(const b of DEC[i].bea){const c=beaC(b,i);hole(c.x,Q(c.y),95*b.s,.6)}}
function wowGlow(y0,y1,hp){
  // warm rays from the entrance
  if(y0<SURF+700){const g=ctx.createLinearGradient(0,200,0,820);g.addColorStop(0,'rgba(255,185,105,.16)');g.addColorStop(1,'rgba(255,185,105,0)');ctx.fillStyle=g;
    for(let k=0;k<5;k++){const sw=Math.sin(T*.25+k*1.7)*14,bx=W/2+(k-2)*30;ctx.beginPath();ctx.moveTo(bx-12,200);ctx.lineTo(bx+12,200);ctx.lineTo(bx+(k-2)*60+40+sw,820);ctx.lineTo(bx+(k-2)*60-40+sw,820);ctx.closePath();ctx.fill()}}
  // themed lights: explored ones bright, deeper ones glimmer through the dark
  for(let i=0;i<12;i++){const yA=TOPH+i*SH;if(yA>y1+120||yA+SH<y0-120)continue;const acc=hex(STR[i].acc),on=i<=S.cur;
    for(const b of DEC[i].bea){const c=beaC(b,i),p=.85+.15*Math.sin(T*1.7+b.ph);glow(c.x,c.y,80*b.s,acc,(on?.4:.26)*p);glow(c.x,c.y,22*b.s,mix(acc,[255,255,255],.5),(on?.35:.2)*p)}}
  // current strato: rotating rune ring and a beam of light
  if(S.cur<12){const i=S.cur,x=sx(i),y=sy(i),acc=hex(STR[i].acc);
    const g=ctx.createLinearGradient(0,y,0,y+300);g.addColorStop(0,rgb(acc,.22));g.addColorStop(1,rgb(acc,0));ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-30,y);ctx.lineTo(x+30,y);ctx.lineTo(x+14,y+300);ctx.lineTo(x-14,y+300);ctx.fill();
    ctx.strokeStyle=rgb(acc,.55);ctx.lineWidth=3;for(let k=0;k<12;k++){const a=T*.6+k*Math.PI/6;ctx.beginPath();ctx.arc(x,y,54,a,a+.32);ctx.stroke()}
    ctx.strokeStyle=rgb(acc,.3);ctx.lineWidth=2;for(let k=0;k<8;k++){const a=-T*.9+k*Math.PI/4;ctx.beginPath();ctx.arc(x,y,62,a,a+.18);ctx.stroke()}}
  // dust motes floating in the lantern light
  const hx=hp.x+12,hy=hp.y+28;for(const m of MOTES){const x=hx+Math.sin(T*m.f+m.p)*m.r,y=hy+Math.cos(T*m.f*.7+m.p*2)*m.r*.8-((T*8*m.f+m.p*30)%60)+30,a=.5*(1-m.r/150)*(.6+.4*Math.sin(T*3+m.p));glow(x,y,3*m.s,[255,220,160],a)}
  // bursts
  PARTS=PARTS.filter(p=>(p.l-=1/60)>0);for(const p of PARTS){p.x+=p.vx;p.y+=p.vy;p.vy-=.06;p.vx*=.98;glow(p.x,p.y,5+4*p.l,p.c,Math.min(1,p.l*1.2))}
  if(flash){flash.t+=1/60;const a=1-flash.t/.9;if(a<=0)flash=null;else{ctx.strokeStyle=rgb(flash.c,a*.8);ctx.lineWidth=6*a+1;ctx.beginPath();ctx.arc(flash.x,flash.y,30+flash.t*160,0,7);ctx.stroke();glow(flash.x,flash.y,120,flash.c,a*.5)}}}
function burst(i){const x=sx(i),y=sy(i),c=hex(STR[i].acc);for(let k=0;k<46;k++){const a=Math.random()*6.28,v=1+Math.random()*4.5;PARTS.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v+1.5,l:.8+Math.random()*.8,c:Math.random()<.4?[255,230,150]:c})}flash={x,y,t:0,c};shakeT=.35}
function vignette(){ctx.setTransform(dpr,0,0,dpr,0,0);const g=ctx.createRadialGradient(W/2,VH*.5,VH*.3,W/2,VH*.5,VH*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.42)');ctx.fillStyle=g;ctx.fillRect(0,0,W,VH)}
function frame(ts){T=ts/1000;
  if(Math.abs(heroTo-heroS)>.001){heroS+=Math.sign(heroTo-heroS)*Math.min(Math.abs(heroTo-heroS),.012+Math.abs(heroTo-heroS)*.03)}
  const hp=pathPt(heroS);heroEl.style.left=hp.x+'px';heroEl.style.top=P(hp.y)+'px';
  if(follow>0){follow--;const tgt=P(hp.y)-VH*.6,sc=scrollY;scrollTo(0,sc+(tgt-sc)*.12)}
  const sc=scrollY,y0=H-sc-VH,y1=H-sc;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#050406';ctx.fillRect(0,0,W,VH);ctx.setTransform(dpr,0,0,-dpr,0,(H-sc)*dpr);
  ctx.lineJoin='round';ctx.lineCap='round';
  drawBack(y0,y1);drawDecor(y0,y1);drawWalls(y0,y1);drawRuler(y0,y1);wowBack(y0,y1);drawPath(y0,y1);if(y0<SURF+80)drawEntrance(sc);
  LAMPS.forEach((l,k)=>{lampA[k]+=((total()>=l.at?1:0)-lampA[k])*.04;const p=lampPos(k);if(p.y>y0-60&&p.y<y1+60)U(p.x,p.y,()=>lamp(p.x,p.y,p.left,lampA[k]))});
  // darkness: deeper = darker, unexplored = almost black, lights cut holes
  const ht=depthT(hp.y),HR=(220-85*ht)*(1+.03*Math.sin(T*11)+.02*Math.sin(T*7.3));
  dctx.setTransform(dpr,0,0,dpr,0,0);dctx.globalCompositeOperation='source-over';dctx.clearRect(0,0,W,VH);
  const g=dctx.createLinearGradient(0,0,0,VH);for(let k=0;k<=16;k++)g.addColorStop(k/16,`rgba(3,2,5,${darkA(H-sc-k*VH/16).toFixed(3)})`);dctx.fillStyle=g;dctx.fillRect(0,0,W,VH);
  dctx.globalCompositeOperation='destination-out';
  const Q=y=>H-y-sc;hole(hp.x+12,Q(hp.y+28),HR,1);wowHoles(Q);
  LAMPS.forEach((l,k)=>{if(lampA[k]>.02){const p=lampPos(k);hole(p.x,Q(p.y),135*lampA[k]*(1+.03*Math.sin(T*8+k)),.92*lampA[k])}});
  for(let i=0;i<Math.min(S.cur+1,12);i++)hole(sx(i),Q(sy(i)),95,i<S.cur?.6:.45);
  if(S.cur>=12)hole(W/2,Q(FY()),170,.8);
  if(y0<SURF+200){hole(W/2-92,Q(150),110,.7);hole(W/2+92,Q(150),110,.7)}
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(dk,0,0);
  // glows that pierce the dark
  ctx.setTransform(dpr,0,0,-dpr,0,(H-sc)*dpr);ctx.globalCompositeOperation='lighter';
  if(y0<SURF+200)[-92,92].forEach(o=>glow(W/2+o,150,34,[255,170,70],.5+.1*Math.sin(T*9+o)));
  glow(hp.x+12,hp.y+28,60,[255,190,90],.35+.05*Math.sin(T*9));
  LAMPS.forEach((l,k)=>{if(lampA[k]>.02){const p=lampPos(k);glow(p.x,p.y-2,40,[255,180,80],.45*lampA[k])}});
  for(let i=0;i<12;i++){const yA=TOPH+i*SH;if(yA>y1+40||yA+SH<y0-200)continue;const o=DEC[i],s=STR[i],acc=hex(s.acc);
    if(s.ch==1)for(const b of o.bits){const p=.18+.12*Math.sin(T*1.5+b.s*9);ctx.strokeStyle=rgb(acc,p*(1-ring(i)*.25));ctx.lineWidth=5;ctx.beginPath();b.pts.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}
    if(s.ch==2)for(const[x,y,ph]of o.flies){const fx=x+Math.sin(T*.5+ph)*50,fy=y+Math.cos(T*.37+ph*2)*30,on=.5+.5*Math.sin(T*2+ph*3);glow(fx,fy,9,acc,.6*on*(1-ring(i)*.3))}
    for(const[x,y,ph,red]of o.eyes){const d=Math.hypot(x-hp.x,y-hp.y);if(d<HR*1.05)continue;const bl=Math.sin(T*.6+ph*3);if(bl<-.85)continue;const op=clamp((d-HR)/80,0,1)*(.55+.2*Math.sin(T+ph));
      const c=red?[255,90,70]:[255,225,140];const ey=y+Math.sin(T*.3+ph)*3;glow(x-6,ey,7,c,op);glow(x+6,ey,7,c,op);ctx.fillStyle=rgb(c,op);ctx.beginPath();ctx.ellipse(x-6,ey,2.4,bl<-.6?.6:1.6,0,0,7);ctx.ellipse(x+6,ey,2.4,bl<-.6?.6:1.6,0,0,7);ctx.fill()}}
  // a faint light at the very bottom: the hook
  const fy=FY()+150;if(fy>y0-100&&fy<y1+200){const p=.5+.5*Math.sin(T*1.3);glow(W/2,fy,60+10*p,[190,200,255],.18+.12*p);glow(W/2,fy,10,[230,235,255],.5+.3*p)}
  wowGlow(y0,y1,hp);
  ctx.globalCompositeOperation='source-over';vignette();
  if(shakeT>0){shakeT-=1/60;const m=shakeT*14,dx=(Math.random()-.5)*m,dy=(Math.random()-.5)*m;cv.style.transform=`translate(calc(-50% + ${dx}px),${dy}px)`;world.style.transform=`translate(${dx}px,${dy}px)`}else{cv.style.transform='';world.style.transform=''}
  requestAnimationFrame(frame)}

// ---------- sheet & toast ----------
const sheet=$('sheet');let tq=[],tBusy=false;
function open(k,t,html){$('shK').textContent=k;$('shT').textContent=t;$('shB').innerHTML=html;sheet.classList.add('show')}
$('shX').onclick=()=>sheet.classList.remove('show');
function toast(msg,paper){tq.push([msg,paper]);if(!tBusy)nextT()}
function nextT(){const n=tq.shift();if(!n){tBusy=false;return}tBusy=true;const el=$('toast');el.textContent=n[0];el.className=n[1]?'paper show':'show';setTimeout(()=>{el.classList.remove('show');setTimeout(nextT,380)},2100)}
const starsTxt=n=>'★'.repeat(n)+'☆'.repeat(3-n);
function openStrato(i){const s=STR[i],known=i<=S.cur+NAME_RANGE;
  if(!known)return open('Strato '+(i+1)+' · −??? m','???','<p>Troppo buio per vedere cosa c\'è quaggiù. Scendi ancora e la tua lanterna lo illuminerà.</p>');
  let h=`<p style="font:400 22px var(--disp);color:var(--gold);letter-spacing:2px;margin-bottom:6px">${starsTxt(S.stars[i])}</p>`;
  h+=`<p>Ogni stella resta tua per sempre: perdere non toglie niente. Con 3 stelle trovi una pagina del diario.</p>`;
  if(i<S.cur)h+=S.stars[i]<3?`<button class="btn" id="rp">Rigioca per 3★</button>`:`<p style="color:var(--muted)">Strato completato.</p>`;
  else if(i==S.cur)h+=`<button class="btn" id="go">Scendi qui</button>`;else h+=`<p style="color:var(--muted)">Prima finisci lo strato sopra.</p>`;
  open('Strato '+(i+1)+' · −'+s.d+' m',s.n,h);
  const rp=$('rp');if(rp)rp.onclick=()=>{sheet.classList.remove('show');setStars(i,3)};const go=$('go');if(go)go.onclick=()=>{sheet.classList.remove('show');win()}}
function openPage(i){
  if(i==12)return open('Ultima pagina','Il diario di Ilda','<div class="diary">La pagina è vuota.<br>Accanto al diario c\'è la sua lanterna. È ancora calda.</div><p style="margin-top:12px">Sotto i tuoi piedi, una crepa sottile. Da lì sale una lucina fredda…</p>');
  if(S.stars[i]<3)return open('Pagina '+(i+1)+' di 13','Pagina strappata',`<p>Qualcuno è sceso prima di te e ha lasciato il suo diario. Prendi <b>3★</b> nello strato ${i+1} per trovare questa pagina.</p>`);
  open('Pagina '+(i+1)+' di 13','Il diario di Ilda',`<div class="diary">${DIARY[i]}</div>`)}
function openLamp(k){const l=LAMPS[k],ok=total()>=l.at;
  open('Lanterna · ★ '+l.at,ok?'Lanterna accesa':'Lanterna spenta',`<p>${ok?'Questo tratto di pozzo resta illuminato per sempre.':'Raccogli <b>'+l.at+' stelle</b> per accenderla. Ogni lanterna accesa illumina per sempre un pezzo di pozzo.'}</p><p><b style="color:var(--gold)">Premio:</b> ${l.r}</p>`)}
function openFondo(){open('−???? m','Il Fondo',S.cur>=12?'<p>Hai toccato il fondo. Nessuno era mai arrivato così giù.</p><p>Ma laggiù, in una crepa, brilla ancora una lucina…</p><p style="color:var(--muted)">(Qui potrebbe iniziare un secondo giro, ancora più buio.)</p>':'<p>Nessuno sa cosa ci sia laggiù. Da lassù si vede solo una lucina, piccola piccola, che non si spegne mai.</p>')}

// ---------- simulation ----------
function afterChange(prevTotal,prevPages){
  LAMPS.forEach(l=>{if(prevTotal<l.at&&total()>=l.at)toast('Lanterna accesa! '+l.r)});
  S.stars.forEach((v,i)=>{if(v==3&&!prevPages[i])toast('Hai trovato una pagina del diario!',true)});
  makeNodes();S.stars.forEach((v,i)=>{if(v==3&&!prevPages[i]){const p=world.querySelector(`[data-pg="${i}"]`);if(p)p.classList.add('new')}})}
function setStars(i,n){const pt=total(),pp=S.stars.map(v=>v==3);S.stars[i]=Math.max(S.stars[i],n);afterChange(pt,pp)}
function win(){if(S.cur>=12)return;const pt=total(),pp=S.stars.map(v=>v==3);const i=S.cur;S.stars[i]=SEQ[i];S.cur++;heroTo=S.cur+1;follow=150;const nx=S.cur;setTimeout(()=>{if(nx<12)burst(nx)},900);
  toast(starsTxt(SEQ[i])+'  −'+STR[i].d+' m');if(S.cur>=12)setTimeout(()=>toast('Hai toccato il fondo.',true),400);afterChange(pt,pp)}
$('bW').onclick=win;
$('bR').onclick=()=>{S.stars=S.stars.map(()=>0);S.cur=0;heroTo=heroS=1;lampA=lampA.map(()=>0);makeNodes();scrollTo(0,H)};
addEventListener('resize',()=>{build()});
build();heroS=heroTo=S.cur+1;scrollTo(0,Math.max(0,P(pathPt(heroS).y)-innerHeight*.6));requestAnimationFrame(frame);
})();
</script>
